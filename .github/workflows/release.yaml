# Release: publish ctap-ask to crates.io.
#
# **Releasing is merging a version bump.** On every push to `main` the
# `version` job reads the crate version; if tag `v<version>` does not exist
# yet, this run publishes it and then tags that commit, so a run that fails
# its gate leaves no tag and the next push to `main` tries again. No hand
# tagging, no publishing from a laptop. Pushing a `v*` tag by hand still works
# and must match the version. A main push that doesn't change the version does
# nothing here.
#
# Every change to `main` is a pull request reviewed by someone other than its
# author (branch protection), so a release is always a reviewed commit.
#
# No secrets. publish uses crates.io trusted publishing (GitHub OIDC -> a
# short-lived crates.io token, revoked when the job ends). One-time setup on
# crates.io for `ctap-ask`: Settings -> Trusted Publishing -> GitHub,
# owner `mdegans`, repository `ctap-ask`, workflow `release.yaml`, no
# environment. 0.1.0 was published by hand, so the crate exists; 0.1.0 has no
# tag, which does not matter here: only the current version's tag is looked
# for. Until the trusted publisher is added, the publish job fails at
# "Authenticate with crates.io", nothing is published or tagged, and the next
# push to `main` tries again.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

# Two merges in quick succession must not race to tag and publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # Decide whether this run releases:
  #  - a `v*` tag push releases iff the tag matches the version exactly;
  #  - a push to main releases iff `v<version>` doesn't exist yet.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read crate version
        id: meta
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$VERSION" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run releases
        id: decide
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="v$VERSION"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              [ "$GITHUB_REF_NAME" = "$TAG" ] || {
                echo "::error::tag $GITHUB_REF_NAME != $TAG (crate version)"
                exit 1
              }
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            push:branch)
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                echo "$TAG already exists; nothing to release."
                echo "release=false" >> "$GITHUB_OUTPUT"
              else
                echo "Releasing $TAG from $GITHUB_SHA."
                echo "release=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # The same gate as CI's `check` job, on the commit being released: CI's run
  # on the same commit starts at the same moment, and a publish must not
  # outrun it.
  check:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      # No lockfile is committed (this is a library), so resolve one here,
      # test against exactly it, and hand it to the publish job: what is
      # published is then what was tested.
      - run: cargo generate-lockfile

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked
      - run: cargo build --locked --all-features --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: tested-lockfile
          path: Cargo.lock
          if-no-files-found: error

  publish:
    needs: [version, check]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token crates.io exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # The lockfile the check job tested against.
      - uses: actions/download-artifact@v4
        with:
          name: tested-lockfile

      # `--locked`: fail rather than publish against any other resolution.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  # Only after the publish, and in its own job: the publish job doesn't need to
  # write to the repository.
  tag:
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      # Pushing the release tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
