[package]
name = "ctap-ask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Ask a FIDO2 security key to sign over USB HID: getAssertion, getInfo and reading a PIN token. No code to create or delete credentials, change a PIN or reset a key."
repository = "https://github.com/mdegans/ctap-ask"
readme = "README.md"
keywords = ["fido2", "ctap2", "webauthn", "passkey", "security-key"]
categories = ["authentication", "cryptography", "hardware-support"]
exclude = [".github/"]

[features]
default = []
# Checking an assertion's signature against a credential's public key
# (ES256 and EdDSA). Off by default: a client that only asks for
# assertions leaves verifying them to the server.
verify = ["p256/ecdsa", "dep:ed25519-dalek"]
# The `ctap-ask-probe` binary. Its command-line dependencies are not the
# library's.
probe = ["verify", "dep:anyhow", "dep:base64", "dep:clap", "dep:rpassword"]

[dependencies]
ciborium = "0.2"
thiserror = "2"
zeroize = "1"
# The PIN/UV auth protocols (CTAP 2.1 §6.5): ECDH on P-256, SHA-256, HKDF,
# HMAC and AES-256-CBC. RustCrypto only: no OpenSSL, no ring.
aes = "0.8"
cbc = "0.1"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

# `verify`
ed25519-dalek = { version = "2", optional = true }

# `probe`
anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rpassword = { version = "7", optional = true }

# The transport. On Linux this is hidapi's pure-Rust hidraw backend with the
# pure-Rust `basic-udev` (no libudev, no C). On macOS hidapi compiles one C
# file and links IOKit. Not built for Windows: see the README.
[target.'cfg(not(windows))'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }

[[bin]]
name = "ctap-ask-probe"
path = "src/bin/ctap-ask-probe.rs"
required-features = ["probe"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package.metadata.docs.rs]
all-features = true
